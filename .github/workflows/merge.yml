name: merge

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      # Every check runs even when another fails, so a push reports all its problems at once.
      fail-fast: false
      matrix:
        check: [typecheck, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        if: matrix.check == 'typecheck'
        run: npm run typecheck
      - name: Build
        if: matrix.check == 'build'
        run: npm run build

  commitlint:
    # Pull requests only: on a direct push the commit-msg hook has already checked the message locally.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # semantic-release derives the version from the commit messages, so a non-conventional message
          # on main would silently produce no release.
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint commit messages
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
