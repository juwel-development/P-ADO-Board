<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>ADO Board</title>
  <desc>An original indigo task board with ivory cards and an amber completed card.</desc>
  <defs>
    <linearGradient id="tile" x1="188" y1="100" x2="836" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#777BFF"/>
      <stop offset=".48" stop-color="#5554D8"/>
      <stop offset="1" stop-color="#35318B"/>
    </linearGradient>
    <linearGradient id="paper" x1="512" y1="304" x2="512" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E8FF"/>
    </linearGradient>
    <linearGradient id="amber" x1="652" y1="304" x2="818" y2="656" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE3A8"/>
      <stop offset="1" stop-color="#FFBC67"/>
    </linearGradient>
  </defs>
  <rect x="100" y="112" width="824" height="824" rx="186" fill="#211E60" opacity=".12"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="4"/>
  <!-- Three headings and staggered cards describe the board without a third-party mark. -->
  <g fill="#FFFFFF" fill-opacity=".55">
    <rect x="204" y="250" width="100" height="16" rx="8"/>
    <rect x="422" y="250" width="100" height="16" rx="8"/>
    <rect x="640" y="250" width="100" height="16" rx="8"/>
  </g>
  <g fill="#242064" fill-opacity=".18" transform="translate(0 10)">
    <rect x="204" y="304" width="180" height="274" rx="30"/>
    <rect x="422" y="304" width="180" height="180" rx="30"/>
    <rect x="640" y="304" width="180" height="352" rx="30"/>
  </g>
  <rect x="204" y="304" width="180" height="274" rx="30" fill="url(#paper)"/>
  <rect x="422" y="304" width="180" height="180" rx="30" fill="url(#paper)"/>
  <rect x="640" y="304" width="180" height="352" rx="30" fill="url(#amber)"/>
  <rect x="204" y="610" width="180" height="116" rx="30" fill="#FFFFFF" fill-opacity=".25"/>
  <rect x="422" y="516" width="180" height="210" rx="30" fill="#FFFFFF" fill-opacity=".42"/>
  <g stroke="#6360B8" stroke-opacity=".38" stroke-width="14" stroke-linecap="round">
    <path d="M240 354H330M240 390H300"/>
    <path d="M458 354H548M458 390H516"/>
  </g>
  <path d="M682 402L716 436L776 368" stroke="#674118" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#925C22" stroke-opacity=".38" stroke-width="14" stroke-linecap="round">
    <path d="M676 506H766M676 542H736"/>
  </g>
</svg>
